<!-- @dsCard group="Selection" height=244 subtitle="2~5개 중 하나 — neutral · primary" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Segment — preview</title>
<style>body{margin:0;background:var(--bg-main)} .pv{padding:var(--spacing-4);display:flex;flex-direction:column;gap:var(--spacing-4)} .pv-cap{font-size:12px;line-height:14px;color:var(--text-body-subtle);margin:0 0 var(--spacing-2)}</style>
</head>
<body>
<div id="root" class="ds-root pv"></div>
<script>
var D = window.DS, h = React.createElement;
function cap(t) { return h('p', { className: 'pv-cap' }, t); }
function row() { return h.apply(null, ['div', { className: 'ds-row' }].concat([].slice.call(arguments))); }
function sect(t) { return h.apply(null, ['div', null, cap(t)].concat([].slice.call(arguments, 1))); }
function App() {
  var a = React.useState('chart'), b = React.useState('m');
  return h(React.Fragment, null,
    sect('neutral — 선택 surface-subtlest + elevation-1', h(D.Segment, { items: [{ value: 'chart', label: '그래프' }, { value: 'table', label: '표' }], value: a[0], onChange: a[1] })),
    sect('primary · fill', h('div', { style: { maxWidth: 400 } }, h(D.Segment, { color: 'primary', fill: true, items: [{ value: 'd', label: '일간' }, { value: 'w', label: '주간' }, { value: 'm', label: '월간' }], value: b[0], onChange: b[1] }))),
    sect('Size sm · md · lg', row(h(D.Segment, { size: 'sm', items: ['1년', '3년'], value: '1년' }), h(D.Segment, { size: 'md', items: ['1년', '3년'], value: '1년' }), h(D.Segment, { size: 'lg', items: ['1년', '3년'], value: '1년' }))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
