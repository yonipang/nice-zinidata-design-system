<!-- @dsCard group="Selection" height=160 subtitle="primary · green × md · sm · xs · 2xs" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Switch — preview</title>
<style>body{margin:0;background:var(--bg-main)} .pv{padding:var(--spacing-4);display:flex;flex-direction:column;gap:var(--spacing-4)} .pv-cap{font-size:12px;line-height:14px;color:var(--text-body-subtle);margin:0 0 var(--spacing-2)}</style>
</head>
<body>
<div id="root" class="ds-root pv"></div>
<script>
var D = window.DS, h = React.createElement;
function cap(t) { return h('p', { className: 'pv-cap' }, t); }
function row() { return h.apply(null, ['div', { className: 'ds-row' }].concat([].slice.call(arguments))); }
function sect(t) { return h.apply(null, ['div', null, cap(t)].concat([].slice.call(arguments, 1))); }
function App() {
  var s = React.useState(true);
  return h(React.Fragment, null,
    sect('즉시 켜고 끄는 설정', row(h(D.Switch, { checked: s[0], onChange: s[1], label: '알림 받기' }), h(D.Switch, { label: '꺼짐' }), h(D.Switch, { variant: 'green', checked: true, label: 'green' }),
      h(D.Switch, { checked: true, state: 'hover', label: 'hover' }), h(D.Switch, { disabled: true, label: 'disabled' }), h(D.Switch, { disabled: true, checked: true, label: 'disabled' }))),
    sect('Size md 56×32 · sm 48×28 · xs 42×24 · 2xs 36×20', row.apply(null, ['md','sm','xs','2xs'].map(function (z) { return h(D.Switch, { key: z, size: z, checked: true }); }))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
