<!-- @dsCard group="Cards" height=234 subtitle="Card Layout lg · sm + Contents Header" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Card — preview</title>
<style>body{margin:0;background:var(--bg-main)} .pv{padding:var(--spacing-4);display:flex;flex-direction:column;gap:var(--spacing-4)} .pv-cap{font-size:12px;line-height:14px;color:var(--text-body-subtle);margin:0 0 var(--spacing-2)}</style>
</head>
<body>
<div id="root" class="ds-root pv"></div>
<script>
var D = window.DS, h = React.createElement;
function cap(t) { return h('p', { className: 'pv-cap' }, t); }
function row() { return h.apply(null, ['div', { className: 'ds-row' }].concat([].slice.call(arguments))); }
function sect(t) { return h.apply(null, ['div', null, cap(t)].concat([].slice.call(arguments, 1))); }
function App() {
  return h('div', { style: { background: 'var(--bg-subtler)', padding: 'var(--spacing-6)', display: 'grid', gridTemplateColumns: '2fr 1fr', gap: 'var(--spacing-4)', alignItems: 'start' } },
    h(D.Card, { title: '월별 매출 추이', description: '2026년 1~9월', action: h(D.Button, { color: 'neutral', variant: 'ghost', size: 'sm', iconRight: 'chevron-right' }, '자세히') },
      h('p', { style: { margin: 0, fontSize: 14, lineHeight: '20px', color: 'var(--text-body-main)' } }, '카드 lg — 모서리 surface-lg 24 · 여백 24 · elevation-1. 차트 · 표 · 긴 목록은 Card Layout에 넣는다.')),
    h(D.Card, { size: 'sm', title: '카드 sm' }, h('p', { style: { margin: 0, fontSize: 14, lineHeight: '20px' } }, '모바일 · 좁은 칸 — 모서리 · 여백 16')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
