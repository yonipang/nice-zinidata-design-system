<!-- @dsCard group="Navigation" height=278 subtitle="Side Navigation Item — basic · brand × light · dark" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>SideNav — preview</title>
<style>body{margin:0;background:var(--bg-main)} .pv{padding:var(--spacing-4);display:flex;flex-direction:column;gap:var(--spacing-4)} .pv-cap{font-size:12px;line-height:14px;color:var(--text-body-subtle);margin:0 0 var(--spacing-2)}</style>
</head>
<body>
<div id="root" class="ds-root pv"></div>
<script>
var D = window.DS, h = React.createElement;
function cap(t) { return h('p', { className: 'pv-cap' }, t); }
function row() { return h.apply(null, ['div', { className: 'ds-row' }].concat([].slice.call(arguments))); }
function sect(t) { return h.apply(null, ['div', null, cap(t)].concat([].slice.call(arguments, 1))); }
var ITEMS = [{ value: 'home', label: '대시보드', icon: 'function' }, { value: 'rep', label: '보고서', icon: 'edit' }, { value: 'r1', label: '월간 보고서', depth: 2 }, { value: 'r2', label: '업종 보고서', depth: 2 }, { value: 'set', label: '설정', icon: 'settings-4' }];
function App() {
  var g = { display: 'grid', gridTemplateColumns: 'repeat(4, auto)', gap: 'var(--spacing-3)', justifyContent: 'start' };
  return h('div', { style: g },
    h('div', null, cap('basic · light'), h(D.SideNav, { items: ITEMS, value: 'r1' })),
    h('div', null, cap('brand · light'), h(D.SideNav, { items: ITEMS, color: 'brand', value: 'r1' })),
    h('div', null, cap('basic · dark'), h(D.SideNav, { items: ITEMS, background: 'dark', value: 'r1' })),
    h('div', null, cap('brand · dark'), h(D.SideNav, { items: ITEMS, background: 'dark', color: 'brand', value: 'r1' })));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
