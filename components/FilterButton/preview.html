<!-- @dsCard group="Actions" height=700 subtitle="누르면 필터 목록(FilterMenu) · soft · neutral · dashed · sm~2xl" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>preview</title>
<style>body{margin:0;background:var(--bg-main)} .pv{padding:var(--spacing-4);display:flex;flex-direction:column;gap:var(--spacing-4)} .pv-cap{font-size:12px;line-height:14px;color:var(--text-body-subtle);margin:0 0 var(--spacing-2)}</style>
</head>
<body>
<div id="root" class="ds-root pv"></div>
<script>
var D = window.DS, h = React.createElement;
function cap(t) { return h("p", { className: "pv-cap" }, t); }
function row() { return h.apply(null, ["div", { className: "ds-row" }].concat([].slice.call(arguments))); }
function sect(t) { return h.apply(null, ["div", null, cap(t)].concat([].slice.call(arguments, 1))); }
var SIZES = ["sm", "md", "lg", "xl", "2xl"];
var SECS = [{ title: "수납", options: ["OCR", "자동납부", "가상계좌"] }, { title: "기간", multiple: false, options: ["최근 1개월", "최근 3개월", "최근 1년"] }];
function Live(p) { return h(D.FilterDropdown, { variant: p.variant, label: "수납종류", sections: SECS, defaultValue: { 0: ["OCR", "자동납부"] } }); }
function App() {
  return h("div", { className: "ds-col" },
    sect("눌러서 필터 목록 열기 → 고르고 적용 (soft · neutral)", h("div", { className: "ds-row", style: { alignItems: "flex-start", minHeight: 440 } }, h(Live, { variant: "soft" }), h(Live, { variant: "neutral" }))),
    sect("모양 — soft · neutral · dashed, 꺼짐 · 켜짐", row(h(D.FilterButton, null), h(D.FilterButton, { variant: "neutral" }), h(D.FilterButton, { variant: "neutral", active: true, value: "Filter1, Filter2" }), h(D.FilterButton, { variant: "dashed" }), h(D.FilterButton, { variant: "dashed", active: true, value: "Filter1" }))),
    sect("크기 sm · md · lg · xl · 2xl", row.apply(null, SIZES.map(function (z) { return h(D.FilterButton, { key: z, size: z }); }))));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
