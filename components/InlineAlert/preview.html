<!-- @dsCard group="Feedback" height=414 subtitle="영역 안 안내 — soft · line" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>InlineAlert — preview</title>
<style>body{margin:0;background:var(--bg-main)} .pv{padding:var(--spacing-4);display:flex;flex-direction:column;gap:var(--spacing-4)} .pv-cap{font-size:12px;line-height:14px;color:var(--text-body-subtle);margin:0 0 var(--spacing-2)}</style>
</head>
<body>
<div id="root" class="ds-root pv"></div>
<script>
var D = window.DS, h = React.createElement;
function cap(t) { return h('p', { className: 'pv-cap' }, t); }
function row() { return h.apply(null, ['div', { className: 'ds-row' }].concat([].slice.call(arguments))); }
function sect(t) { return h.apply(null, ['div', null, cap(t)].concat([].slice.call(arguments, 1))); }
function App() {
  return h('div', { className: 'ds-col' },
    h(D.InlineAlert, { type: 'information', title: '데이터는 매월 15일에 갱신됩니다.', onClose: function () {} }, '9월 데이터는 10월 15일에 반영됩니다.'),
    h(D.InlineAlert, { type: 'warning', title: '표본 수가 30개 미만입니다.' }),
    h(D.InlineAlert, { type: 'negative', title: '파일을 불러오지 못했습니다.', action: h(D.Button, { color: 'neutral', variant: 'base', size: 'sm' }, '다시 시도') }),
    h(D.InlineAlert, { type: 'positive', variant: 'line', title: '보고서를 저장했습니다.' }),
    h(D.InlineAlert, { type: 'basic', variant: 'line', title: '기본 안내 · line' }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
