<!-- @dsCard group="Navigation" height=230 subtitle="GNB 56 · ghost · underline · 메뉴 글자 17 medium" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>preview</title>
<style>body{margin:0;background:var(--bg-main)} .pv{padding:var(--spacing-4);display:flex;flex-direction:column;gap:var(--spacing-4)} .pv-cap{font-size:12px;line-height:14px;color:var(--text-body-subtle);margin:0 0 var(--spacing-2)}</style>
</head>
<body>
<div id="root" class="ds-root pv"></div>
<script>
var D = window.DS, h = React.createElement;
function cap(t) { return h("p", { className: "pv-cap" }, t); }
function sect(t) { return h.apply(null, ["div", null, cap(t)].concat([].slice.call(arguments, 1))); }
var ITEMS = [{ value: "home", label: "홈" }, { value: "sales", label: "매출분석", hasMenu: true }, { value: "cust", label: "고객분석" }, { value: "area", label: "상권분석" }];
var LOGO = h("span", { style: { fontWeight: 700, fontSize: 18, letterSpacing: "-0.02em", color: "var(--text-heading-main)" } }, "NICE ZINIDATA");
function App() {
  var s = React.useState("sales"), v = s[0], set = s[1];
  var right = h("div", { className: "ds-row" }, h(D.Button, { color: "primary", variant: "soft", size: "sm" }, "관리자"), h(D.IconButton, { icon: "user", label: "내 정보", size: "md" }));
  return h("div", { style: { display: "flex", flexDirection: "column", gap: "var(--spacing-4)", background: "var(--bg-subtler)", padding: "var(--spacing-3)" } },
    sect("ghost (기본) · hover는 state layer", h(D.GlobalNav, { items: ITEMS, value: v, onChange: set, logo: LOGO, right: right })),
    sect("underline · 가운데 정렬", h(D.GlobalNav, { tabStyle: "underline", align: "center", items: ITEMS, value: v, onChange: set, logo: LOGO, right: right })));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
