<!-- @dsCard group="Actions" height=520 subtitle="모달 · 시트 하단 ButtonSet(fill · fit · 세로 · 홈 표시줄) + 메뉴 하단 MenuButtonSet" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>preview</title>
<style>body{margin:0;background:var(--bg-main)} .pv{padding:var(--spacing-4);display:flex;flex-direction:column;gap:var(--spacing-4)} .pv-cap{font-size:12px;line-height:14px;color:var(--text-body-subtle);margin:0 0 var(--spacing-2)}</style>
</head>
<body>
<div id="root" class="ds-root pv"></div>
<script>
var D = window.DS, h = React.createElement;
function cap(t) { return h("p", { className: "pv-cap" }, t); }
function row() { return h.apply(null, ["div", { className: "ds-row", style: { alignItems: "flex-start" } }].concat([].slice.call(arguments))); }
function sect(t) { return h.apply(null, ["div", null, cap(t)].concat([].slice.call(arguments, 1))); }
var SIZES = ["sm", "md", "lg", "xl", "2xl"];
function S(C, props) { var s = React.useState(props.value), v = s[0], set = s[1]; return h(C, Object.assign({}, props, { value: v, onChange: set })); }
function Box(p) { return h("div", { style: { width: p.w || 400, padding: "0 var(--spacing-5) var(--spacing-5)", background: "var(--surface-main)", border: "1px solid var(--border-neutral-subtle)", borderRadius: "var(--rounded-surface-sm)" } }, p.children); }
function App() {
  return h("div", { className: "ds-col" },
    sect("fill · 가로 2개 (xl) — 보조 soft + 주요 solid", h(Box, null, h(D.ButtonSet, { buttons: [{ label: "취소" }, { label: "저장" }] }))),
    sect("fit · 오른쪽 맞춤 + 왼쪽 버튼 (lg)", h(Box, { w: 480 }, h(D.ButtonSet, { layout: "fit", size: "lg", left: h(D.Button, { color: "neutral", variant: "ghost", size: "lg" }, "초기화"), buttons: [{ label: "취소", color: "neutral", variant: "base" }, { label: "확인" }] }))),
    sect("fill · 세로 + 홈 표시줄 (모바일 시트)", h(Box, { w: 320 }, h(D.ButtonSet, { align: "vertical", indicator: true, buttons: [{ label: "나중에" }, { label: "지금 시작" }] }))),
    sect("MenuButtonSet — 메뉴 하단 (cta 2개 · cta 1개 · text)", h("div", { className: "ds-col", style: { width: 300 } }, h(D.MenuButtonSet, { buttons: [{ label: "초기화" }, { label: "적용" }] }), h(D.MenuButtonSet, { align: "center", buttons: [{ label: "전체 보기" }] }), h(D.MenuButtonSet, { type: "text", buttons: [{ label: "모두 지우기" }, { label: "닫기" }] }))));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
