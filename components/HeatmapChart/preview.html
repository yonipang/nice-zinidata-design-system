<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>preview</title>
<style>body{margin:0;background:var(--bg-main)} .pv{padding:var(--spacing-4);display:flex;flex-direction:column;gap:var(--spacing-4)} .pv-cap{font-size:12px;line-height:14px;color:var(--text-body-subtle);margin:0 0 var(--spacing-2)}</style>
</head>
<body>
<div id="root" class="ds-root pv"></div>
<script>
var D = window.DS, h = React.createElement;
function cap(t) { return h("p", { className: "pv-cap" }, t); }
function row() { return h.apply(null, ["div", { className: "ds-row", style: { alignItems: "flex-start" } }].concat([].slice.call(arguments))); }
function sect(t) { return h.apply(null, ["div", null, cap(t)].concat([].slice.call(arguments, 1))); }
var SIZES = ["sm", "md", "lg", "xl", "2xl"];
function S(C, props) { if (C && C.C) { props = C; C = C.C; } var s = React.useState(props.value), v = s[0], set = s[1]; return h(C, Object.assign({}, props, { value: v, onChange: set })); }
var X = ["06", "08", "10", "12", "14", "16", "18", "20", "22"], Y = ["월", "화", "수", "목", "금", "토", "일"];
var DATA = []; Y.forEach(function (y, yi) { X.forEach(function (x, xi) { var base = [8, 22, 30, 62, 40, 35, 48, 41, 18][xi]; var w = yi >= 5 ? 0.8 + (xi > 3 ? 0.4 : 0) : 1; DATA.push([xi, yi, Math.round(base * w + (yi * 3 % 7))]); }); });

  return h(D.Card, { title: "요일 · 시간대별 결제 건수", description: "단위: 건 · 칸에 마우스를 올리면 값" }, h(D.HeatmapChart, { height: 320, unit: "건", valueName: "결제 건수", xCategories: X.map(function (x) { return x + "시"; }), yCategories: Y, data: DATA }));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
